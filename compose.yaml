# Homelab stack. See SPEC.md for what each service is and why.
#
# Deploy loop (from the box, over Tailscale SSH):
#   git pull && docker compose up -d
#
# Secrets/config not in git:
#   .env                        — copy from .env.example, fill in
#   cloudflared/<tunnel-id>.json — created by `cloudflared tunnel create`
#                                  (see docs/tunnel-setup.md), gitignored

name: homelab

# The torrent stack (gluetun + transmission) lives in its own file because every
# service in it must share gluetun's network namespace — keeping them together
# makes that guarantee legible and makes it hard to add a sibling service without
# confronting it. It is still ONE stack: `docker compose up -d` here brings up
# everything, and `docker compose ps` lists it all. See SPEC.md §"The torrent
# stack" and docs/decisions/torrent-vpn.md.
include:
  - torrent/compose.yaml

services:
  # The tunnel. Egress-only; opens no inbound ports. Locally-managed —
  # routes live in ./cloudflared/config.yml (git-tracked), creds JSON is
  # human-supplied and gitignored. At migration time config.yml has no real
  # ingress routes (everything is Tailscale-private). See SPEC.md §Access planes.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # Mounts both config.yml and the creds JSON (read-only).
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - homelab_net

  # Docker registry. Tailscale-private, plain HTTP, published on host port
  # 30500. NEVER behind Cloudflare Access — that breaks `docker push`
  # (Docker auth can't do OAuth redirects). See SPEC.md.
  # Addressed everywhere as ${REGISTRY_HOST} (i.e. <tailscale-ip>:30500),
  # not by this service name.
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # Bound to the Tailscale IP only — NOT 0.0.0.0 — so the box's home-LAN
      # interface can't reach this unauthenticated HTTP registry. Needs
      # tailscale0 up before start; restart policy retries if it isn't.
      - "${TAILSCALE_IP}:30500:5000"
    volumes:
      - registry_data:/var/lib/registry
    # /v2/ is the registry API root — a 200 means it can actually serve pulls,
    # which is what the duri deploy depends on. `registry:2` has no wget/curl, so
    # this uses the statically-linked binary the image does ship.
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - homelab_net

  # Home Assistant. host networking is REQUIRED for mDNS/SSDP device
  # discovery (same reason it was hostNetwork under k3s). Consequence: it is
  # NOT on homelab_net and can't resolve other services by compose DNS — this
  # is expected. Reach it at <tailscale-ip>:8123. Do NOT move it onto the
  # bridge to "fix" this; that breaks discovery. See SPEC.md.
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ha_data:/config

  # duri — the human's couples-finance app (Next.js). Runs as a stateless
  # artifact per SPEC Pattern A: built on a dev machine, pushed to the registry,
  # pulled here. Its DB/auth/realtime/storage live in Supabase cloud, NOT on this
  # box — so no volume. Tailscale-private (no cloudflared ingress); both partners
  # reach it over Tailscale at https://<box>.<magicdns> (tailscale serve). See
  # SPEC.md §Services and scripts/serve-duri.sh.
  #
  # The deployed version is PINNED INLINE here (git SHA, never :latest), like
  # every other service — the tag lives in git, so `git blame`/`git revert` are
  # the deploy log and rollback. The `scripts/deploy-duri.sh` one-command deploy
  # bumps this line, pushes, and reconciles the box. Bring up only after the
  # image exists (the script builds+pushes first). See SPEC.md §Deploy.
  duri:
    image: ${REGISTRY_HOST}/duri:c6f2b81   # bumped by scripts/deploy-duri.sh — never :latest
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    # Server-only app secrets (Supabase service-role key, DATABASE_URL, OpenAI
    # key) — gitignored, kept OUT of the shared .env. The NEXT_PUBLIC_* Supabase
    # URL + anon key are baked into the image at build time, not set here.
    # The authoritative key list is `duri.env.example`; `scripts/push-duri-env.sh`
    # projects it onto the box and `scripts/deploy-duri.sh` refuses to deploy
    # when one is missing.
    env_file:
      - duri.env
    # `restart: unless-stopped` hides a crash-loop indefinitely — the container
    # keeps coming back and `docker compose ps` says "Up" every time you look.
    # This makes a broken app distinguishable from a running one. Reuses the same
    # /api/version endpoint the deploy already verifies, so a healthy check means
    # the app is actually serving, not merely that a process exists.
    # start_period covers Next's cold boot; failures before it don't count.
    # NOTE: this image has NO wget and NO curl (verified against the image, not
    # assumed — the first draft used wget and would have marked duri permanently
    # unhealthy). It does ship node v22, which has global fetch, so the check is
    # written in node deliberately. Re-verify if the base image ever changes.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      # Bound to loopback only. The sole tailnet-facing door is HTTPS via
      # `tailscale serve` (scripts/serve-duri.sh), which terminates TLS on the box
      # and proxies to this port. duri needs a SECURE CONTEXT (HTTPS) for its PWA
      # service worker + Web Crypto (crypto.randomUUID) — plain HTTP on the
      # Tailscale IP is not a secure context, so we no longer publish there.
      - "127.0.0.1:3000:3000"
    networks:
      - homelab_net

  # gerbera — DLNA media server for the living-room projector (Hisense M2 Pro,
  # VIDAA OS). Serves finished downloads over the LAN. See SPEC.md §"Media
  # serving — gerbera" and docs/decisions/dlna-media.md.
  #
  # ─────────────────────────────────────────────────────────────────────────
  # THIS SERVICE SHARES THE TORRENT STACK'S *VOLUME*, NEVER ITS *NETWORK*.
  # It reads the files transmission writes, but must NOT join gluetun's
  # namespace: that would make it unreachable from the living room AND tunnel a
  # living-room video stream through Tokyo. That is why it lives here in the
  # root compose file rather than in torrent/compose.yaml — the file boundary
  # reinforces the network boundary.
  # ─────────────────────────────────────────────────────────────────────────
  gerbera:
    image: gerbera/gerbera:3.2.1
    restart: unless-stopped
    # REQUIRED, not a preference. DLNA discovery is SSDP multicast
    # (239.255.255.250:1900) and docker bridge networks do NOT carry multicast to
    # the LAN — a bridged gerbera is simply never discovered by the projector,
    # while looking perfectly healthy. Same forced exception as home-assistant,
    # for the same class of reason.
    network_mode: host
    environment:
      # The image's entrypoint usermods the gerbera user (default 1042) to these.
      # Aligned with transmission's PUID/PGID so the media files it reads are
      # owned by the same user that wrote them.
      UID: ${PUID}
      GID: ${PGID}
      TZ: ${TZ}
    volumes:
      # Config is a git-tracked FILE, mounted read-only. Gerbera does not rewrite
      # it at runtime (state lives in the SQLite DB below), which is exactly why
      # this can be tracked — unlike transmission's settings.json, which is
      # rewritten on shutdown and therefore needs an asserter script instead.
      - ./media/gerbera/config.xml:/var/run/gerbera/config.xml:ro
      # Writable state: the SQLite library DB.
      - gerbera_data:/var/run/gerbera
      # The media, READ-ONLY. A DLNA server has no reason to modify media, so a
      # bug or compromise here cannot touch the library.
      # Points at complete/ NOT the parent: transmission writes in-progress files
      # to a sibling incomplete/ and moves them on completion (same filesystem =
      # atomic rename). Scanning the parent would surface half-written files as
      # broken entries in the projector's 콘텐츠 공유 list.
      # Uses the guarded bind-volume form (see volumes: below), NOT a plain bind.
      - torrent_complete:/media:ro
    # NO `ports:` key. Under network_mode: host it would be silently IGNORED —
    # the same trap as `ports:` on a network_mode: service: container in the
    # torrent stack. Gerbera binds 49494/tcp (HTTP) and 1900/udp (SSDP) directly
    # on the host. The admin UI is disabled in config.xml, since host networking
    # gives no way to bind it to loopback.

networks:
  homelab_net:
    driver: bridge

volumes:
  registry_data:
  ha_data:
  gerbera_data:
  # The completed-downloads directory, as a GUARDED bind — same form and same
  # reason as torrent_downloads in torrent/compose.yaml.
  #
  # A plain `- /srv/torrents/complete:/media:ro` bind is silently created by
  # Docker as an empty ROOT-OWNED directory when the path is missing. That is not
  # hypothetical: it happened here on 2026-08-15 during a test run, and it breaks
  # transmission rather than gerbera — transmission (uid 1000) then cannot move
  # completed downloads into a root-owned directory, so torrents finish and go
  # nowhere, while gerbera reports a perfectly healthy empty library.
  #
  # This form refuses to start the container instead. The directory is created
  # once, with the right ownership, by the runbook (docs/torrent.md §1.3).
  torrent_complete:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TORRENT_DOWNLOADS:-/srv/torrents}/complete
